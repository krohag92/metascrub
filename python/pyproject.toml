[project]
name = "metascrub"
version = "0.1.0"
description = "View and strip metadata from images, videos, audio, and documents. Python port of the metadatafinder.com toolkit."
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "metadatafinder.com" }]
requires-python = ">=3.9"
keywords = ["metadata", "exif", "iptc", "xmp", "gps", "privacy", "scrub", "pdf", "docx", "mp3"]
dependencies = [
  "Pillow>=10.0",
  "piexif>=1.1",
  "pypdf>=4.0",
  "python-docx>=1.0",
  "tinytag>=1.10",
  "click>=8.1",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.1",
  "build>=1.0",
]

[project.urls]
Homepage = "https://metadatafinder.com"
Repository = "https://github.com/metascrub/metascrub"
Documentation = "https://metadatafinder.com/docs/python"

[project.scripts]
metascrub = "metascrub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metascrub"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
